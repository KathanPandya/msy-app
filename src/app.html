<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
	<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
	<script>
		var consoleParam = new URLSearchParams(location.search).get('console');
		if (consoleParam === '1') {
			localStorage.setItem('showConsole', 'true');
		} else if (consoleParam === '0') {
			localStorage.setItem('showConsole', 'false');
		}
		if (localStorage.getItem('showConsole') === 'true') {
			eruda.init();
		}
	</script>
</body>

</html>
