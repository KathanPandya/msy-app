<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="manifest" href="/manifest.webmanifest" />
	<meta name="theme-color" content="#135a82" />
	<link rel="icon" href="/logos/03_Favicon/favicon.ico" sizes="any" />
	<link rel="icon" type="image/png" sizes="32x32" href="/logos/03_Favicon/favicon-32x32.png" />
	<link rel="apple-touch-icon" href="/logos/01_App_Icon/apple-touch-icon-180.png" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-title" content="MSY" />
	<script type="text/javascript">
		if ('%sveltekit.env.PUBLIC_IS_PRODUCTION%' === 'true') {
			(function(c,l,a,r,i,t,y){
				c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
				t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
				y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
			})(window, document, "clarity", "script", "yfo62a6hop");
		}
	</script>
	%sveltekit.head%

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
	<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
	<script>
		var consoleParam = new URLSearchParams(location.search).get('console');
		if (consoleParam === '1') {
			localStorage.setItem('showConsole', 'true');
		} else if (consoleParam === '0') {
			localStorage.setItem('showConsole', 'false');
		}
		if (localStorage.getItem('showConsole') === 'true') {
			eruda.init();
		}
	</script>
</body>

</html>
