name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lightsail
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build Svelte app
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.PROD_API_URL }}

      - name: Upload build to staging
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_SSH_PORT || 22 }}
          source: build/
          target: /tmp/msy-app-release
          strip_components: 1
          rm: true
          overwrite: true

      - name: Publish staging build to web root
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_SSH_PORT || 22 }}
          script: |
            set -eu
            STAGING="/tmp/msy-app-release"
            DEST="${{ vars.LIGHTSAIL_DEPLOY_PATH }}"
            if [ -z "$DEST" ]; then
              DEST="/var/www/html"
            fi

            sudo -n mkdir -p "$DEST"

            if command -v rsync >/dev/null 2>&1; then
              sudo -n rsync -a --delete "$STAGING"/ "$DEST"/
            else
              sudo -n find "$DEST" -mindepth 1 -delete
              sudo -n cp -a "$STAGING"/. "$DEST"/
            fi
